# Smart Media Cleanup – custom app for TrueNAS SCALE 25.04+ (tested on 25.10)
#
# WHERE TO PASTE THIS
#   Not in the «Install iX App» form (the one with Repository, Tag, Hostname …).
#   1. Apps → Discover Apps.
#   2. Top right: click the arrow / menu next to «Custom App» and choose «Install via YAML».
#   3. Name: mediacleanup
#   4. Custom Config: paste this WHOLE file (the comments can stay).
#   5. Save. TrueNAS pulls the image from ghcr.io and starts the app on http://<truenas-ip>:30480
#
# BEFORE YOU INSTALL (once, in the TrueNAS shell as root) – adjust the path to your pool:
#   mkdir -p /mnt/tank/apps/mediacleanup/data
#   chown -R 568:568 /mnt/tank/apps/mediacleanup/data
#
# LIBRARIES: mount each media folder under /media/<Name> (see «volumes» below). The app finds
# them on first start, names the libraries after the folders and works out the TrueNAS path.
# Check the result under Settings → Libraries and paths.
#
# READ-ONLY BY DEFAULT: with «:ro» the app can never delete anything on disk itself – at most
# through Radarr/Sonarr/Plex, and only if you switch it on in the app. Remove «:ro» only on the
# folders where you want to clean up duplicates, downloads or orphaned folders from the app.
#
# WEB UI BUTTON: x-portals gives the «Web UI» button in the Apps list. TrueNAS only reads it at
# install time. If it opens 0.0.0.0, replace host with the IP address of the TrueNAS machine.

x-portals:
  - name: Web UI
    scheme: http
    host: 0.0.0.0
    port: 30480
    path: /

services:
  mediacleanup:
    # :latest = the latest release. TrueNAS shows «Update available» when a new version is out,
    # and Apps → mediacleanup → ⋮ → Update fetches it. To pin a version, use e.g. :1.0.0
    image: ghcr.io/pederko/smart-media-cleanup:latest
    restart: unless-stopped
    user: "568:568"
    ports:
      - "30480:8000"
    environment:
      TZ: Etc/UTC          # your time zone, e.g. Europe/Oslo
      # Optional: set addresses/keys here instead of in the web UI.
      # Values set here override and lock the fields in the app.
      # SMC_RADARR_URL: "http://<nas-ip>:30025"
      # SMC_RADARR_API_KEY: ""
      # SMC_SONARR_URL: "http://<nas-ip>:30027"
      # SMC_SONARR_API_KEY: ""
      # SMC_PLEX_URL: "http://<nas-ip>:32400"
      # SMC_PLEX_TOKEN: ""
      # SMC_TAUTULLI_URL: "http://<nas-ip>:30047"
      # SMC_TAUTULLI_API_KEY: ""
      # SMC_SEERR_URL: "http://<nas-ip>:30357"
      # SMC_SEERR_API_KEY: ""
      # SMC_QBITTORRENT_URL: "http://<nas-ip>:30024"
      # SMC_QBITTORRENT_USERNAME: ""
      # SMC_QBITTORRENT_PASSWORD: ""
      # Optional login (basic auth) for the web UI:
      # SMC_USERNAME: "admin"
      # SMC_PASSWORD: ""
    volumes:
      - /mnt/tank/apps/mediacleanup/data:/data
      # One line per media folder: <path on TrueNAS>:/media/<Name>:ro
      - /mnt/tank/media/Movies:/media/Movies:ro
      - /mnt/tank/media/TV:/media/TV:ro
      - /mnt/tank/media/downloads:/media/downloads:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
