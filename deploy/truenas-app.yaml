# Smart Media Cleanup – app-oppsett for TrueNAS SCALE 25.10 (Goldeye)
#
# HVOR DENNE LIMES INN
#   Dette er IKKE for skjemaet «Install iX App» (det med Repository, Tag, Hostname osv.).
#   1. Apps → Discover Apps.
#   2. Øverst til høyre: klikk på pilen / menyen ved siden av knappen «Custom App»
#      og velg «Install via YAML».
#   3. Name: mediacleanup
#   4. Custom Config: lim inn HELE denne filen (kommentarene kan være med).
#   5. Save. TrueNAS henter imaget fra ghcr.io og starter appen på http://<truenas-ip>:30480
#
# FØR DU INSTALLERER (én gang, i TrueNAS-shell som root):
#   mkdir -p /mnt/pool1/apps/mediacleanup/data
#   chown -R 568:568 /mnt/pool1/apps/mediacleanup/data
#
# Alle mediemapper monteres skrivebeskyttet (:ro). Appen kan ikke slette eller endre filer.
# Adresser og nøkler til Radarr/Sonarr/Plex/Tautulli/Seerr legges inn i appen etterpå
# (Innstillinger), eller som miljøvariabler under «environment» nedenfor.
#
# WEB UI-KNAPP: x-portals gir knappen «Web UI» i Apps-oversikten. TrueNAS leser den
# bare ved installasjon – har du allerede installert appen uten den, må appen slettes og
# installeres på nytt (data i /mnt/pool1/apps/mediacleanup/data beholdes).
# Åpner knappen 0.0.0.0, bytt host med TrueNAS-maskinens IP-adresse.

x-portals:
  - name: Web UI
    scheme: http
    host: 0.0.0.0
    port: 30480
    path: /

services:
  mediacleanup:
    # :latest = siste utgivelse. TrueNAS viser «Update available» når en ny versjon er ute,
    # og Apps → mediacleanup → ⋮ → Update henter den. Vil du låse versjonen: bruk f.eks. :0.3.0
    image: ghcr.io/pederko/smart-media-cleanup:latest
    restart: unless-stopped
    user: "568:568"
    ports:
      - "30480:8000"
    environment:
      TZ: Europe/Oslo
      # Valgfritt: sett adresser/nøkler her i stedet for i grensesnittet.
      # Verdier satt her overstyrer og låser feltene i appen.
      # SMC_RADARR_URL: "http://192.168.1.10:30025"
      # SMC_RADARR_API_KEY: ""
      # SMC_SONARR_URL: "http://192.168.1.10:30027"
      # SMC_SONARR_API_KEY: ""
      # SMC_PLEX_URL: "http://192.168.1.10:32400"
      # SMC_PLEX_TOKEN: ""
      # SMC_TAUTULLI_URL: "http://192.168.1.10:30047"
      # SMC_TAUTULLI_API_KEY: ""
      # SMC_SEERR_URL: "http://192.168.1.10:30357"
      # SMC_SEERR_API_KEY: ""
      # Valgfri innlogging (Basic auth) for nettsiden:
      # SMC_USERNAME: "admin"
      # SMC_PASSWORD: ""
    volumes:
      - /mnt/pool1/apps/mediacleanup/data:/data
      # :ro = bare lesetilgang. For å kunne slette duplikatfiler (identiske kopier og ekstra versjoner)
      # fra appen: fjern :ro på mappene det gjelder, og slå det på under Innstillinger → Sletting.
      - /mnt/pool1/FILM:/media/FILM:ro
      - /mnt/pool1/TV:/media/TV:ro
      - /mnt/pool1/Barn:/media/Barn:ro   # fjern :ro for å kunne rydde duplikater i Barn
      - /mnt/pool1/tmp:/media/tmp:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
