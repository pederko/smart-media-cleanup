name: Test and publish image

# Releases are driven by the VERSION file:
#   * push to main           -> tests, image :edge and :sha-xxxxxxx
#   * new value in VERSION   -> also :<version>, :<major.minor>, :latest, git tag v<version> and a GitHub release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to create the tag and release
  packages: write   # to publish to ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type check and build the web UI
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: ver
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.ver.outputs.owner }}/smart-media-cleanup
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ steps.ver.outputs.release }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ steps.ver.outputs.release }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.release }}
            type=raw,value=edge
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.ver.outputs.release == 'true' && steps.ver.outputs.version || format('{0}-edge', steps.ver.outputs.version) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create tag and release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          notes="$(awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)"
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" \
            --notes "${notes:-See CHANGELOG.md}

          Image: \`ghcr.io/${{ steps.ver.outputs.owner }}/smart-media-cleanup:$V\`"
